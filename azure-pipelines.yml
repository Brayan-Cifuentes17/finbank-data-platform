trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: finbank-secrets
  - name: terraformVersion
    value: '1.7.0'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/infra'
  - name: azureServiceConnection
    value: 'sc-finbank-manual'

stages:
- stage: Validar
  displayName: 'validar terraform plan sobre dev'
  jobs:
    - job: PlanDev
      displayName: 'terraform plan -var-file=dev.tfvars'
      steps:
        - script: |
            curl -sL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
            unzip -o terraform.zip
            sudo mv terraform /usr/local/bin/
            terraform version
          displayName: 'Instalar Terraform (sin extension de Marketplace)'

        - task: AzureCLI@2
          displayName: 'terraform init + plan (via Azure CLI session)'
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            addSpnToEnvironment: true
            inlineScript: |
              cd $(workingDirectory)
              export ARM_CLIENT_ID=$servicePrincipalId
              export ARM_CLIENT_SECRET=$servicePrincipalKey
              export ARM_TENANT_ID=$tenantId
              export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
              terraform init -backend-config="key=finbank-pipeline.tfstate"
              terraform plan \
                -var-file="dev.tfvars" \
                -var="sql_admin_password=$(SQL_ADMIN_PASSWORD_DEV)" \
                -var="alert_email=$(ALERT_EMAIL)" \
                -out=tfplan
- stage: DesplegarDev
  displayName: 'Desplegar a dev'
  dependsOn: Validar
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - deployment: ApplyDev
      displayName: 'terraform apply (dev)'
      environment: 'finbank-dev'   
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - script: |
                  curl -sL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
                  unzip -o terraform.zip
                  sudo mv terraform /usr/local/bin/
                  terraform version
                displayName: 'Instalar Terraform (sin extension de Marketplace)'

              - task: AzureCLI@2
                displayName: 'terraform init + apply (dev)'
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  inlineScript: |
                    cd $(workingDirectory)
                    export ARM_CLIENT_ID=$servicePrincipalId
                    export ARM_CLIENT_SECRET=$servicePrincipalKey
                    export ARM_TENANT_ID=$tenantId
                    export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                    terraform init -backend-config="key=finbank-pipeline.tfstate"
                    terraform apply -auto-approve \
                      -var-file="dev.tfvars" \
                      -var="sql_admin_password=$(SQL_ADMIN_PASSWORD_DEV)" \
                      -var="alert_email=$(ALERT_EMAIL)"
- stage: DesplegarPdn
  displayName: 'Desplegar a pdn con aprobacion'
  dependsOn: DesplegarDev
  condition: succeeded()
  jobs:
    - deployment: ApplyPdn
      displayName: 'terraform apply (pdn)'
      environment: 'finbank-pdn'   
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - script: |
                  curl -sL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
                  unzip -o terraform.zip
                  sudo mv terraform /usr/local/bin/
                  terraform version
                displayName: 'Instalar Terraform (sin extension de Marketplace)'

              - task: AzureCLI@2
                displayName: 'terraform init + apply (pdn)'
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  inlineScript: |
                    cd $(workingDirectory)
                    export ARM_CLIENT_ID=$servicePrincipalId
                    export ARM_CLIENT_SECRET=$servicePrincipalKey
                    export ARM_TENANT_ID=$tenantId
                    export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                    terraform init -backend-config="key=finbank-pdn.tfstate"
                    terraform apply -auto-approve \
                      -var-file="pdn.tfvars" \
                      -var="sql_admin_password=$(SQL_ADMIN_PASSWORD_PDN)" \
                      -var="alert_email=$(ALERT_EMAIL)"
              - task: AzureCLI@2
                displayName: 'Desplegar pipelines de ADF en pdn'
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    ADF_NAME_PDN=$(terraform -chdir=$(workingDirectory) output -raw data_factory_name)
                    RG_PDN=$(terraform -chdir=$(workingDirectory) output -raw resource_group_name)

                    for archivo in $(System.DefaultWorkingDirectory)/orchestration/*.json; do
                      nombre_pipeline=$(basename "$archivo" .json)
                      echo "Desplegando pipeline: $nombre_pipeline"
                      az datafactory pipeline create-or-update \
                        --factory-name "$ADF_NAME_PDN" \
                        --resource-group "$RG_PDN" \
                        --name "$nombre_pipeline" \
                        --pipeline "@$archivo"
                    done